name: publish to s3

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Run Hugo
        run: hugo --minify

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Deploy
        run: |
          # Nothing here is content hashed, so everything keeps a short TTL
          # and revalidates with its ETag rather than being pinned in a
          # browser cache.
          aws s3 sync public "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --follow-symlinks \
            --delete \
            --cache-control "public, max-age=300, must-revalidate"

      # Without this the pages sit in S3 while CloudFront serves the old copy
      # until the default TTL expires. Skipped until the variable is set.
      - name: Invalidate CloudFront (optional)
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
